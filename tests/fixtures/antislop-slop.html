<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Inter:wght@400;600&display=swap">
<style>
  body { margin: 0; font-family: Inter, sans-serif; background: linear-gradient(135deg, #7c3aed 0%, #2563eb 100%); color: #fff; }

  .card { border: 1px solid rgba(255,255,255,0.15); border-radius: 24px; padding: 24px; background: rgba(255,255,255,0.05); }
  .num { font-family: "JetBrains Mono", monospace; }
  hr { border: 0; border-top: 1px solid rgba(255,255,255,0.2); }

<body>
  <nav>

      <button type="submit">Get started</button>
    </form>
  </main>

</html>
